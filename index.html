<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>משחק הזיכרון הזיכרון המשחק הזיכרון</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e1b4b">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="משחק הזיכרון הזיכרון">
<meta name="description" content="משחק הזיכרון הזיכרון המשחק הזיכרון בעברית עם דרגות קושי ואימוג'ים חדשים בכל משחק הזיכרון הזיכרון. אפשר להתקין כאפליקציה.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="משחק הזיכרון הזיכרון המשחק הזיכרון">
<meta property="og:title" content="משחק הזיכרון הזיכרון המשחק הזיכרון">
<meta property="og:description" content="מצאו את הזוגות! דרגות קושי ואימוג'ים חדשים בכל משחק הזיכרון הזיכרון.">
<meta property="og:url" content="https://yanai-lez.github.io/The-memory-game-/">
<meta property="og:image" content="https://yanai-lez.github.io/The-memory-game-/og-image.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<style>
  html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
  body {
    margin: 0; height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    background: #1e1b4b; color: #fff; font-family: system-ui, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  h1 { margin: 0; font-size: 28px; }
  .stats { display: flex; gap: 24px; font-size: 18px; }
  .levels { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 0 12px; }
  .level {
    padding: 8px 14px; font-size: 15px; border: 2px solid #6366f1;
    border-radius: 999px; background: transparent; color: #fff; cursor: pointer;
  }
  .level.active { background: #6366f1; }
  .board.locked { opacity: .45; pointer-events: none; }
  .board {
    --w: min(94vw, 420px, calc(100dvh - 300px));
    display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 8px;
    width: var(--w);
  }
  .card {
    aspect-ratio: 1; border: none; border-radius: 12px; cursor: pointer; padding: 0;
    font-size: calc(var(--w) / var(--cols, 4) * 0.5); background: #6366f1; color: transparent;
    transition: transform .25s, background .25s;
  }
  .card.open { background: #fff; color: #000; transform: rotateY(180deg) scaleX(-1); }
  .card.matched { background: #22c55e; color: #000; cursor: default; }
  button.restart {
    padding: 10px 24px; font-size: 16px; border: none; border-radius: 8px;
    background: #f59e0b; color: #000; cursor: pointer;
  }
  #msg { height: 24px; font-size: 20px; }
  #startBtn { font-size: 20px; padding: 12px 20px; font-weight: bold; min-width: 190px; }
  #installBtn { position: fixed; top: 8px; left: 8px; font-size: 12px; padding: 6px 10px; }
  #iosHint { position: fixed; bottom: 6px; left: 0; right: 0; margin: 0; text-align: center; font-size: 12px; }
</style>
</head>
<body>
  <h1>משחק הזיכרון הזיכרון המשחק הזיכרון <img src="icon.svg" alt="" width="40" height="40" style="vertical-align:middle;border-radius:10px"></h1>
  <div class="levels" id="levels"></div>
  <div class="stats">
    <span>מהלכים: <b id="moves">0</b></span>
    <span>זמן: <b id="time">0</b> שנ׳</span>
  </div>
  <button id="startBtn" class="restart">▶ התחל</button>
  <div class="board" id="board"></div>
  <div id="msg"></div>
  <button id="installBtn" class="restart" hidden>📲 התקן</button>
  <p id="iosHint" hidden>באייפון: שיתוף ← "הוסף למסך הבית"</p>

<script>
  const pool = [
    "🐙","🚀","🍕","🎲","🦊","🌵","🎸","🧩","🐼","🍉","⚽","🎈","🐸","🍩","🌈","🔥",
    "🎧","🦄","🐢","🍔","🚲","🎯","🍓","🐧","🌻","🎮","🍦","🦋","🐳","🍿","🎨","🚁",
    "🐶","🐱","🦁","🐯","🐵","🐰","🍎","🍌","🍇","🍒","🥑","🌮","🍪","🎂","⭐","🌙",
    "☀️","⚡","❄️","🎁","🔔","🎺","🥁","🏀","🏈","🎳","🛸","⛵","🚂","🏰","💎","🧸"
  ];
  const levels = [
    { name: "קל · 4×4", cols: 4, rows: 4 },
    { name: "בינוני · 6×6", cols: 6, rows: 6 },
    { name: "קשה · 8×8", cols: 8, rows: 8 }
  ];
  let level = 0;
  try {
    const saved = parseInt(localStorage.getItem("memoryLevel2"), 10);
    if (saved >= 0 && saved < levels.length) level = saved;
  } catch (e) {}

  let first = null, lock = false, moves = 0, found = 0, pairs = 0, sec = 0, timer = null, playing = false;
  const startBtn = document.getElementById("startBtn");
  startBtn.onclick = () => (playing ? start() : begin());

  function renderLevels() {
    const box = document.getElementById("levels");
    box.innerHTML = "";
    levels.forEach((L, i) => {
      const b = document.createElement("button");
      b.className = "level" + (i === level ? " active" : "");
      b.textContent = L.name;
      b.onclick = () => {
        level = i;
        try { localStorage.setItem("memoryLevel2", i); } catch (e) {}
        renderLevels();
        start();
      };
      box.appendChild(b);
    });
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function start() {
    clearInterval(timer);
    first = null; lock = false; moves = 0; found = 0; sec = 0;
    document.getElementById("moves").textContent = 0;
    document.getElementById("time").textContent = 0;
    document.getElementById("msg").textContent = "";
    const board = document.getElementById("board");
    board.innerHTML = "";
    const L = levels[level];
    pairs = L.cols * L.rows / 2;
    board.style.setProperty("--cols", L.cols);
    board.style.setProperty("--w", `min(${L.cols >= 8 ? "96vw, 560px" : "94vw, 420px"}, calc(100dvh - 300px))`);
    board.style.gap = L.cols >= 8 ? "5px" : "8px";
    const picks = shuffle([...pool]).slice(0, pairs);
    shuffle([...picks, ...picks]).forEach(e => {
      const c = document.createElement("button");
      c.className = "card";
      c.dataset.e = e;
      c.textContent = e;
      c.onclick = () => flip(c);
      board.appendChild(c);
    });
    playing = false;
    board.classList.add("locked");
    startBtn.textContent = "▶ התחל";
  }

  function begin() {
    playing = true;
    document.getElementById("board").classList.remove("locked");
    startBtn.textContent = "🔄 משחק הזיכרון הזיכרון חדש";
    clearInterval(timer);
    timer = setInterval(() => {
      document.getElementById("time").textContent = ++sec;
    }, 1000);
  }

  function flip(c) {
    if (!playing || lock || c.classList.contains("open") || c.classList.contains("matched")) return;
    c.classList.add("open");
    if (!first) { first = c; return; }
    moves++;
    document.getElementById("moves").textContent = moves;
    if (first.dataset.e === c.dataset.e) {
      first.classList.replace("open", "matched");
      c.classList.replace("open", "matched");
      first = null;
      if (++found === pairs) {
        clearInterval(timer);
        document.getElementById("msg").textContent =
          `🎉 ניצחת ב-${moves} מהלכים ו-${sec} שניות!`;
      }
    } else {
      lock = true;
      setTimeout(() => {
        first.classList.remove("open");
        c.classList.remove("open");
        first = null; lock = false;
      }, 800);
    }
  }

  renderLevels();
  start();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
  }

  let deferredPrompt;
  const installBtn = document.getElementById("installBtn");

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.hidden = true;
  };

  window.addEventListener("appinstalled", () => { installBtn.hidden = true; });

  const isIOS = /iphone|ipad/i.test(navigator.userAgent);
  const standalone = matchMedia("(display-mode: standalone)").matches;
  if (isIOS && !standalone) document.getElementById("iosHint").hidden = false;
</script>
</body>
</html>
