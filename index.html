<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>משחק זיכרון</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e1b4b">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="זיכרון">
<meta property="og:title" content="משחק זיכרון">
<meta property="og:image" content="icon-512.png">
<style>
  body {
    margin: 0; min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px;
    background: #1e1b4b; color: #fff; font-family: system-ui, sans-serif;
  }
  h1 { margin: 0; font-size: 28px; }
  .stats { display: flex; gap: 24px; font-size: 18px; }
  .levels { display: flex; gap: 8px; }
  .level {
    padding: 8px 16px; font-size: 15px; border: 2px solid #6366f1;
    border-radius: 999px; background: transparent; color: #fff; cursor: pointer;
  }
  .level.active { background: #6366f1; }
  .board {
    --w: min(94vw, 420px);
    display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); gap: 8px;
    width: var(--w);
  }
  .card {
    aspect-ratio: 1; border: none; border-radius: 12px; cursor: pointer; padding: 0;
    font-size: calc(var(--w) / var(--cols, 4) * 0.5); background: #6366f1; color: transparent;
    transition: transform .25s, background .25s;
  }
  .card.open { background: #fff; color: #000; transform: rotateY(180deg) scaleX(-1); }
  .card.matched { background: #22c55e; color: #000; cursor: default; }
  button.restart {
    padding: 10px 24px; font-size: 16px; border: none; border-radius: 8px;
    background: #f59e0b; color: #000; cursor: pointer;
  }
  #msg { height: 24px; font-size: 20px; }
</style>
</head>
<body>
  <h1>משחק זיכרון <img src="icon.svg" alt="" width="40" height="40" style="vertical-align:middle;border-radius:10px"></h1>
  <div class="levels" id="levels"></div>
  <div class="stats">
    <span>מהלכים: <b id="moves">0</b></span>
    <span>זמן: <b id="time">0</b> שנ׳</span>
  </div>
  <div class="board" id="board"></div>
  <div id="msg"></div>
  <button class="restart" onclick="start()">משחק חדש</button>
  <button id="installBtn" class="restart" hidden>📲 התקן כאפליקציה</button>
  <p id="iosHint" hidden style="font-size:14px">באייפון: שיתוף ← "הוסף למסך הבית"</p>

<script>
  const pool = [
    "🐙","🚀","🍕","🎲","🦊","🌵","🎸","🧩","🐼","🍉","⚽","🎈","🐸","🍩","🌈","🔥",
    "🎧","🦄","🐢","🍔","🚲","🎯","🍓","🐧","🌻","🎮","🍦","🦋","🐳","🍿","🎨","🚁",
    "🐶","🐱","🦁","🐯","🐵","🐰","🍎","🍌","🍇","🍒","🥑","🌮","🍪","🎂","⭐","🌙",
    "☀️","⚡","❄️","🎁","🔔","🎺","🥁","🏀","🏈","🎳","🛸","⛵","🚂","🏰","💎","🧸"
  ];
  const levels = [
    { name: "קל", cols: 4, rows: 3 },
    { name: "בינוני", cols: 4, rows: 4 },
    { name: "קשה", cols: 6, rows: 6 }
  ];
  let level = 1;
  try {
    const saved = parseInt(localStorage.getItem("memoryLevel"), 10);
    if (saved >= 0 && saved < levels.length) level = saved;
  } catch (e) {}

  let first = null, lock = false, moves = 0, found = 0, pairs = 0, sec = 0, timer = null;

  function renderLevels() {
    const box = document.getElementById("levels");
    box.innerHTML = "";
    levels.forEach((L, i) => {
      const b = document.createElement("button");
      b.className = "level" + (i === level ? " active" : "");
      b.textContent = L.name;
      b.onclick = () => {
        level = i;
        try { localStorage.setItem("memoryLevel", i); } catch (e) {}
        renderLevels();
        start();
      };
      box.appendChild(b);
    });
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function start() {
    clearInterval(timer);
    first = null; lock = false; moves = 0; found = 0; sec = 0;
    document.getElementById("moves").textContent = 0;
    document.getElementById("time").textContent = 0;
    document.getElementById("msg").textContent = "";
    const board = document.getElementById("board");
    board.innerHTML = "";
    const L = levels[level];
    pairs = L.cols * L.rows / 2;
    board.style.setProperty("--cols", L.cols);
    const picks = shuffle([...pool]).slice(0, pairs);
    shuffle([...picks, ...picks]).forEach(e => {
      const c = document.createElement("button");
      c.className = "card";
      c.dataset.e = e;
      c.textContent = e;
      c.onclick = () => flip(c);
      board.appendChild(c);
    });
    timer = setInterval(() => {
      document.getElementById("time").textContent = ++sec;
    }, 1000);
  }

  function flip(c) {
    if (lock || c.classList.contains("open") || c.classList.contains("matched")) return;
    c.classList.add("open");
    if (!first) { first = c; return; }
    moves++;
    document.getElementById("moves").textContent = moves;
    if (first.dataset.e === c.dataset.e) {
      first.classList.replace("open", "matched");
      c.classList.replace("open", "matched");
      first = null;
      if (++found === pairs) {
        clearInterval(timer);
        document.getElementById("msg").textContent =
          `🎉 ניצחת ב-${moves} מהלכים ו-${sec} שניות!`;
      }
    } else {
      lock = true;
      setTimeout(() => {
        first.classList.remove("open");
        c.classList.remove("open");
        first = null; lock = false;
      }, 800);
    }
  }

  renderLevels();
  start();

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js");
  }

  let deferredPrompt;
  const installBtn = document.getElementById("installBtn");

  window.addEventListener("beforeinstallprompt", e => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.hidden = false;
  });

  installBtn.onclick = async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.hidden = true;
  };

  window.addEventListener("appinstalled", () => { installBtn.hidden = true; });

  const isIOS = /iphone|ipad/i.test(navigator.userAgent);
  const standalone = matchMedia("(display-mode: standalone)").matches;
  if (isIOS && !standalone) document.getElementById("iosHint").hidden = false;
</script>
</body>
</html>
